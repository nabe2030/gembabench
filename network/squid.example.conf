# Allow-list HTTP proxy for the test containers (apt only). Runs on the test-environment host, listens only on the Incus bridge address.
http_port 10.92.0.1:3128
acl gemba_containers src 10.92.0.0/24
acl allowed_dst dstdomain "/etc/squid/allowed-domains.txt"
acl SSL_ports port 443
acl Safe_ports port 80 443
acl CONNECT method CONNECT
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access allow gemba_containers allowed_dst
http_access deny all
cache_mem 128 MB
cache_dir ufs /var/spool/squid 2000 16 256
maximum_object_size 512 MB
access_log daemon:/var/log/squid/access.log squid
cache_log /var/log/squid/cache.log
coredump_dir /var/spool/squid
via off
forwarded_for delete
visible_hostname gemba-testenv-proxy
refresh_pattern \.(deb|udeb|rpm)$ 129600 100% 129600
refresh_pattern . 0 20% 4320
