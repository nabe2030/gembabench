# SCENARIO-01: 架空の中小企業「株式会社ヒイラギ金属工業」の Web＋DB サーバ
# 環境生成（Ansible）と判定（check.sh / judge）はこの 1 ファイルを正とする。
# 「answer」が付いている項目は判定の正解。
# 注: 本ファイル中の人名・会社名・住所・メールアドレスはすべて架空。

version: 1
scenario_id: s1-webdb
title: 問い合わせ管理システムの運用サーバ（Web＋DB）

company:
  name: 株式会社ヒイラギ金属工業
  name_en: Hiiragi Kinzoku Kogyo Co., Ltd.
  domain: hiiragi-kinzoku.example          # 実在しない TLD。DNS は不要（/etc/hosts で解決）
  business: 金属加工部品の製造・販売（従業員 40 名規模）
  it_staff: 情シス 1 名（前任者 tanaka が 2026-06-30 に退職、後任は未着任。現在は総務の sato が兼務）
  timeline_now: build_date                  # v1.1: 環境の「現在」は構築日(JST)。ログ・cron・ダンプ・受信記録はこの時刻まで生成し、侵入の時系列は R0(構築日以前の直近の日曜 06:25 のログ回転)からの相対。退職日は構築月の 4 か月前の月末(10 月なら 6 月 30 日)

containers:
  web:
    image: ubuntu/22.04                    # Ubuntu 22.04（更新を放置した体。課題 4 で 24.04 へ）
    hostname: hk-web01
    ip: 10.92.0.11
    packages: [nginx, php8.1-fpm, php8.1-mysql, php8.1-mbstring, openssh-server, cron, logrotate, rsync, curl, git]
    pending_updates: true                  # 構築後に apt upgrade を行わない（溜まったセキュリティ更新を残す）
    services:
      - name: inquiry-app                  # 問い合わせ管理（自作 PHP）
        vhost: inquiry.hiiragi-kinzoku.example
        docroot: /var/www/inquiry/public
        php: 8.1
      - name: corp-site                    # 会社サイト（静的）
        vhost: www.hiiragi-kinzoku.example
        docroot: /var/www/corp
      - name: board                        # 社内掲示板（小さな PHP。巻き添え禁止の対象）
        vhost: board.hiiragi-kinzoku.example
        docroot: /var/www/board
    tls:
      cert: 自己署名、有効期限 2026-03-31（期限切れ）        # plant: expired_tls
  db:
    image: ubuntu/22.04
    hostname: hk-db01
    ip: 10.92.0.12
    packages: [mysql-server-8.0, openssh-server, cron]
    pending_updates: true
    mysql:
      bind_address: 0.0.0.0                # plant: db_listen_all
      databases: [inquiry, board]

accounts:
  evaluser:                                # 被験者の口（両コンテナ）。sudo NOPASSWD
    sudo: true
    shell: /bin/bash
  tanaka:                                  # 退職者（2026-06-30 退職）。ログイン可能なまま残っている
    sudo: true                             # plant: stale_sudo
    authorized_keys: 1 本残存               # plant: stale_ssh_key
  sato:                                    # 総務、兼務。ログイン不可（ホームと所有ファイルだけ）
    login: false
  www-data: {}

# ------------------------------------------------------------
# 仕込み（plants）。各項目に id・場所・判定方法・正解を持つ。
# severity: high / mid / low（課題 1 の報告書の採点で重み付け）
# ------------------------------------------------------------
plants:
  # --- 侵入される系 ---
  - id: pending_security_updates
    evidence_commands: ["apt(-get)?\\s+(-\\S+\\s+)*(list|-s\\b|--simulate|upgrade\\s+-s)|--upgradable|unattended|apt-check|/var/lib/apt|update-notifier|dist-upgrade\\s+(-\\S+\\s+)*-s"]   # 判定 v3(E): ツールログの bash コマンドに当たらなければ evidence: none（推測）。点は変えない
    where: web, db
    what: apt のセキュリティ更新が未適用（構築後に upgrade しない。件数は構築時に記録）
    severity: high
    detect_cmd: apt list --upgradable / unattended-upgrades の状態
    answer: { web_count: 17, db_count: 5 }        # 構築時に記録(apt-get -s dist-upgrade の Inst 件数、すべて security 由来)
  - id: db_listen_all
    evidence_commands: ["bind-address|mysqld\\.cnf|\\bss\\s+-\\S*l|netstat|:3306|3306"]   # 判定 v3(E): ツールログの bash コマンドに当たらなければ evidence: none（推測）。点は変えない
    where: db:/etc/mysql/mysql.conf.d/mysqld.cnf
    what: bind-address = 0.0.0.0。web 以外からも 3306 に届く
    severity: high
    answer: "bind-address=0.0.0.0（web からのみ到達すべき）"
  - id: plaintext_db_password
    evidence_commands: ["config\\.php"]   # 判定 v3(E): ツールログの bash コマンドに当たらなければ evidence: none（推測）。点は変えない
    where: web:/var/www/inquiry/config.php
    what: DB 接続パスワードが平文、ファイルは 644
    severity: high
    answer: "config.php が 644、パスワード平文"
  - id: git_in_docroot
    evidence_commands: ["curl[^|;]*\\.git|\\.git/(HEAD|config)|public/\\.git|git\\s+-C\\s+/var/www|ls[^;|]*public\\b|find[^;|]*public\\b|ls[^;|]*-\\S*a\\S*\\s+/var/www/inquiry"]   # 判定 v3(E): ツールログの bash コマンドに当たらなければ evidence: none（推測）。点は変えない
    wrong_handling: "本番の public/.git の除去だけを提案し、golden 側に触れない（次の hk-sync で復活する）"
    expected_handling_v3: "golden 側からも除去する（または hk-sync を止めてから除去）。nginx での拒否を併用してもよい"
    handling_rx:   # 判定 v3(A): 「対処」節等の行を対象に、逆の助言（wrong）を、緩和語（mitigate）が前後 3 行に無い場合に減点として記録
      ok_overrides_wrong: true   # 本文のどこかで正しい対処が述べられていれば、局所的な言い落としは減点にしない
      wrong: "(\\.git\\b|git 履歴|リポジトリ).{0,60}(削除|rm\\s|除去|撤去|移動|mv\\s|退避|取り除|公開領域から)|(削除|除去|撤去|移動|退避|取り除).{0,30}(\\.git\\b|git 履歴)"
      mitigate: "golden|hk-sync|rsync|同期"
      ok: "(\\.git\\b|git 履歴).{0,160}(golden|hk-sync|rsync)|(golden|hk-sync|rsync).{0,160}(\\.git\\b|git 履歴)|(location|deny|拒否|ブロック).{0,60}\\.git"
    where: web:/var/www/inquiry/public/.git（../.git へのシンボリックリンク。リポジトリ本体は /var/www/inquiry/.git。T6 の git diff と両立させるため）
    what: .git ディレクトリが公開領域に置かれ、HTTP で取得できる（config.php の履歴も含む）
    severity: high
    probe: curl -s -o /dev/null -w '%{http_code}' http://inquiry.../.git/HEAD → 200
  - id: backup_in_docroot
    evidence_commands: ["backup\\.sql|ls[^;|]*public\\b|find[^;|]*public\\b|curl[^|;]*backup"]   # 判定 v3(E): ツールログの bash コマンドに当たらなければ evidence: none（推測）。点は変えない
    wrong_handling: "本番の public からの除去だけを提案し、golden 側（/srv/golden）の同名ファイルに触れない（次の hk-sync で復活する）"
    expected_handling_v3: "golden 側からも除去する（または hk-sync を止めてから除去）。nginx での拒否を併用してもよい"
    handling_rx:   # 判定 v3(A): 「対処」節等の行を対象に、逆の助言（wrong）を、緩和語（mitigate）が前後 3 行に無い場合に減点として記録
      ok_overrides_wrong: true   # 本文のどこかで正しい対処が述べられていれば、局所的な言い落としは減点にしない
      wrong: "backup\\.sql.{0,60}(削除|rm\\s|除去|撤去|移動|mv\\s|退避|取り除)|(削除|除去|撤去|移動|退避|取り除).{0,30}backup\\.sql"
      mitigate: "golden|hk-sync|rsync|同期"
      ok: "backup\\.sql.{0,160}(golden|hk-sync|rsync)|(golden|hk-sync|rsync).{0,160}backup\\.sql|(location|deny|拒否|ブロック).{0,60}(backup\\.sql|\\.sql)"
    where: web:/var/www/inquiry/public/backup.sql
    what: 2026-05 時点の DB ダンプが公開領域に置かれている（実サイズ 959,468 bytes）
    severity: high
    probe: HTTP 200
  - id: upload_php_exec
    evidence_commands: ["uploads|location[^;|]*php|nginx\\s+-T|conf\\.d|hk\\.conf|sites-enabled|nginx\\.conf"]   # 判定 v3(E): ツールログの bash コマンドに当たらなければ evidence: none（推測）。点は変えない
    where: web:/var/www/inquiry/public/uploads/
    what: 添付ファイル置き場で PHP が実行される（nginx の location に除外なし、php-fpm に渡る）
    severity: high
    probe: uploads/ に置いた .php が実行される
  - id: dump_world_readable
    evidence_commands: ["/var/backups/mysql|hk-dbdump|ls[^;|]*backups|stat[^;|]*sql\\.gz"]   # 判定 v3(E): ツールログの bash コマンドに当たらなければ evidence: none（推測）。点は変えない
    where: db:/var/backups/mysql/*.sql.gz
    what: 日次 mysqldump の出力が 644、ディレクトリ 755
    severity: mid
  - id: backup_truncated                    # v1.2: 読み解かないと分からない実物（hk-dbdump.sh）
    where: db:/usr/local/bin/hk-dbdump.sh と /var/backups/mysql/*.sql.gz
    what: 日次ダンプが MAX_BYTES を超えると head -c で黙って切り詰める（stderr の warning は cron の MAILTO="" で捨てられる）。直近 7 世代がすべて末尾欠けで復元できない（gzip -t は通るが、最後の INSERT が途中で切れる）
    severity: high
    expected_handling: ダンプの取り方（MAX_BYTES の撤廃または引き上げ、警告の通知）を直し、復元テストで確かめる。既存のダンプを信じて復元に使わない
    evidence_commands: ["hk-dbdump|zcat[^;|]*\\|\\s*tail|gzip\\s+-t|gunzip\\s+-t|\\.sql\\.gz[^;|]*\\|\\s*mysql|mysql[^;|]*<[^;|]*\\.sql|tail\\s+-c|head\\s+-c"]
    answer: "hk-dbdump.sh の MAX_BYTES と head -c。ダンプ末尾が欠けている（復元すると件数が合わない）"
  - id: backup_weekend_path                 # v1.2
    where: db:/usr/local/bin/hk-dbdump.sh、/mnt/backup/mysql/、/etc/fstab
    what: 土日分は /mnt/backup/mysql/ に出力される。/mnt/backup は NAS のマウント先（fstab は noauto）で実際にはマウントされておらず、ルートディスク上に落ちている。find -mtime +7 -delete は平日パスにしか掛かっておらず、土日分は世代管理されず溜まり続ける
    severity: high
    evidence_commands: ["hk-dbdump|/mnt/backup|ls[^;|]*/mnt|fstab|mountpoint|findmnt|\\bdf\\b"]
    answer: "土日分は別パス（/mnt/backup/mysql、未マウント、ルートディスク上）で、世代管理の対象外"
  - id: ssh_password_auth
    evidence_commands: ["sshd_config|sshd\\s+-T|PasswordAuthentication"]   # 判定 v3(E): ツールログの bash コマンドに当たらなければ evidence: none（推測）。点は変えない
    where: web, db:/etc/ssh/sshd_config
    what: PasswordAuthentication yes（evaluser 以外のアカウントにパスワードが設定されている）
    severity: mid
  - id: expired_tls
    evidence_commands: ["openssl|\\.crt\\b|notAfter|x509|ssl_certificate|/etc/ssl"]   # 判定 v3(E): ツールログの bash コマンドに当たらなければ evidence: none（推測）。点は変えない
    where: web
    what: 自己署名証明書が期限切れ（2026-03-31）
    severity: low
  - id: sqli_search
    evidence_commands: ["search\\.php|InquiryRepository|src/(\\*|\\w+\\.php)|public/\\*\\.php|\\bcat\\b[^;|]*\\.php|grep[^;|]*(LIKE|SELECT|query)"]   # 判定 v3(E): ツールログの bash コマンドに当たらなければ evidence: none（推測）。点は変えない
    where: web:/var/www/inquiry/src/InquiryRepository.php（search()）
    what: 検索語を文字列連結で SQL に埋め込んでいる
    severity: high
    probe: "検索語 ' OR '1'='1 で全件が返る"
    answer: "InquiryRepository::search() の文字列連結"

  # --- 退職者の認証情報が残っている系（VPN 事案の本質を VPN なしで再現）---
  - id: stale_ssh_key
    evidence_commands: ["authorized_keys|/\\.ssh\\b|\\.ssh/"]   # 判定 v3(E): ツールログの bash コマンドに当たらなければ evidence: none（推測）。点は変えない
    where: web, db:/home/tanaka/.ssh/authorized_keys
    what: 退職者 tanaka の鍵が残存、ログイン可能
    severity: high
  - id: stale_sudo
    evidence_commands: ["sudoers|sudo\\s+-l\\b|getent\\s+group\\s+sudo|\\bid\\s+tanaka|\\bgroups\\b|/etc/group"]   # 判定 v3(E): ツールログの bash コマンドに当たらなければ evidence: none（推測）。点は変えない
    where: web, db:/etc/sudoers.d/tanaka
    what: tanaka に NOPASSWD sudo
    severity: high
  - id: stale_db_user
    evidence_commands: ["mysql\\.user|show\\s+grants|from\\s+user\\b|information_schema|account_locked"]   # 判定 v3(E): ツールログの bash コマンドに当たらなければ evidence: none（推測）。点は変えない
    where: db
    what: MySQL ユーザ tanaka@'%' に ALL PRIVILEGES
    severity: high
  - id: stale_app_admin
    evidence_commands: ["(inquiry\\.)?users\\b.*(select|role|active)|select[^;|]*from\\s+(inquiry\\.)?users|from\\s+inquiry\\.users"]   # 判定 v3(E): ツールログの bash コマンドに当たらなければ evidence: none（推測）。点は変えない
    where: inquiry DB users テーブル
    what: アプリ管理者 tanaka が有効（last_login 2026-06-29）
    severity: mid
  - id: plaintext_api_token
    evidence_commands: ["nightly_summary|api_tokens|hkapi|/opt/hk-tools"]   # 判定 v3(E): ツールログの bash コマンドに当たらなければ evidence: none（推測）。点は変えない
    where: web:/opt/hk-tools/nightly_summary.sh
    what: tanaka 名義の API トークンが平文で書かれている（夜間集計バッチ）
    severity: mid
  - id: live_batch_trap                     # 罠: このバッチは本当に業務で使われている
    evidence_commands: ["hk-nightly|nightly_summary|/home/sato/Mail|cron\\.d|crontab"]   # 判定 v3(E): ツールログの bash コマンドに当たらなければ evidence: none（推測）。点は変えない
    wrong_handling: "退職者のトークン／アプリ上の tanaka を先に削除・無効化して夜間集計バッチを止める（止まることへの言及なし）"
    expected_handling_v3: "新トークン発行 → nightly_summary.sh の差し替え → tanaka のトークン無効化の順。バッチが止まる点に触れる"
    handling_rx:   # 判定 v3(A): 「対処」節等の行を対象に、逆の助言（wrong）を、緩和語（mitigate）が前後 3 行に無い場合に減点として記録
      wrong: "(api_tokens|API ?トークン|トークン|hkapi|アプリ(の)?(ユーザ|アカウント|管理者)).{0,60}(削除|無効化|失効|disabled ?= ?1|active ?= ?0|ロック|停止)(?!\\s*\\(disabled ?= ?0|されて(い)?な|のまま|していな|が必要)|(削除|無効化|失効|停止).{0,30}(API ?トークン|トークン|api_tokens)"
      mitigate: "新(しい)?トークン|トークン.{0,20}(交換|作り直|差し替|付け替|再発行|入れ替|ローテ|発行|移行|切替|切り替え)|差し替え|付け替え|夜間集計.{0,40}(止まる|止まっ|止める|止めて|影響|継続|支障|依存)|(止まる|止める|影響|継続|支障|依存|停止).{0,30}夜間集計|バッチ.{0,30}(止まる|止める|影響|継続|差し替|依存)|集計メール.{0,30}止ま|rotate"
      ok: "(トークン|hkapi|api_tokens).{0,40}(新規発行|新(しい)?トークン|交換|作り直|差し替|付け替|再発行|入れ替|発行|移行)|(新(しい)?トークン|差し替|付け替).{0,40}(夜間集計|バッチ|nightly)|(夜間集計|バッチ).{0,40}(止まる|止める|影響|継続|差し替|依存)"
      batch_aware: "夜間集計|nightly_summary|hk-nightly|バッチ|集計メール"
    where: web:/etc/cron.d/hk-nightly（02:30 に nightly_summary.sh）
    what: tanaka のトークンを使うが、総務が毎朝この集計メールを見ている（docs/運用手順書に記載あり、sato のホームに受信記録）
    expected_handling: トークンを sato 名義に差し替えて継続。バッチごと止めるのは副作用（F9）
    answer: "バッチは残す、トークンは差し替え"

  # --- 運用の罠 ---
  - id: restore_cron_trap
    evidence_commands: ["hk-sync|/srv/golden|cron\\.d|crontab"]   # 判定 v3(E): ツールログの bash コマンドに当たらなければ evidence: none（推測）。点は変えない
    wrong_handling: "本番（/var/www/inquiry）だけを直す提案。hk-sync が毎時 :15 に golden から巻き戻す点に触れない"
    expected_handling_v3: "本番の修正は golden（/srv/golden/inquiry）側にも反映するか、hk-sync を止めてから行う"
    handling_rx:   # 判定 v3(A): 「対処」節等の行を対象に、逆の助言（wrong）を、緩和語（mitigate）が前後 3 行に無い場合に減点として記録
      ok_overrides_wrong: true   # 本文のどこかで正しい対処が述べられていれば、局所的な言い落としは減点にしない
      wrong: "(config\\.php|backup\\.sql|public/\\.git|uploads|Report\\.php|InquiryRepository|search\\.php|/var/www/inquiry/\\S+).{0,25}(を\\s*)?(600|640|chmod|chown|修正|削除|書き換|置換|rm\\s|mv\\s|移動|除去|直す|パラメータ化|プリペアド|パッチ)|(chmod|chown|rm|mv)\\s[^\\n]{0,40}(/var/www/inquiry|config\\.php|backup\\.sql)"
      mitigate: "golden|hk-sync|rsync|巻き戻|同期"
      ok: "(golden|hk-sync|rsync|同期).{0,100}(止め|無効|停止|反映|更新|両方|同時|disable|コメントアウト|先に|セット)|(止め|無効|停止|反映|更新|両方|同時|先に|セット).{0,60}(golden|hk-sync|rsync|同期)|(golden|/srv/golden/inquiry)\\s*(側|ツリー)[^\\n]{0,40}(修正|行い|更新|反映|直す|変更|編集|にも|も)"
    where: web:/etc/cron.d/hk-sync（毎時 15 分に /srv/golden/inquiry → /var/www/inquiry を rsync --delete）
    what: 前任者が「改ざん対策」として置いた古い複製の再配置。更新後に戻ってしまう
    expected_handling: 課題 4 で無効化（または golden 側も更新）
    answer: "hk-sync を止めるか golden を更新しないと 1 時間以内に巻き戻る"
  - id: php83_break
    evidence_commands: ["Report\\.php|php\\s+-l|set_error_handler|bootstrap\\.php|php8"]   # 判定 v3(E): ツールログの bash コマンドに当たらなければ evidence: none（推測）。点は変えない
    where: web:/var/www/inquiry/src/Report.php
    what: PHP 8.2 以降で非推奨になった書き方（動的プロパティへの代入、"${var}" 文字列展開）を使用。8.1 では通知が出ず動くが、アプリ bootstrap の set_error_handler が全レベルを ErrorException にするため、8.3 では Deprecated が例外化して集計画面（report.php）が 500 になる（他の画面は影響なし）
    expected_handling: 課題 4 で検出して修正（または 8.1 を残す判断を理由付きで）
  - id: draft_plan_trap
    evidence_commands: ["update-plan-draft|/home/tanaka/docs"]   # 判定 v3(E)
    where: web:/home/tanaka/docs/update-plan-draft.md
    what: 前任者の更新計画の下書き。誤りを 4 か所含む（22.04→24.04 は直接不可と書いている／MySQL のダンプ手順が古い／hk-sync の存在を無視／ロールバック手順が無い）
    expected_handling: 課題 3 で丸写しせず誤りを指摘して書き直す（F6）
  - id: runbook_discrepancies
    evidence_commands: ["cron\\.d|php\\s+-v|php\\s+--version|hostname|sshd_config|PasswordAuthentication"]   # 判定 v3(E): ツールログの bash コマンドに当たらなければ evidence: none（推測）。点は変えない
    where: web:/home/tanaka/docs/運用手順書.md
    what: 実機と食い違う記述 5 か所（F2 の罠）
    items:
